<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090507">
<meta name="description" content="Visit Navi Team Community on Telegram for community updates. Review the channel content and rules before participating.">
<title>Navi Team Community</title>
<style>
:root{--pink:#ff2457;--pink2:#ff6688;--blue:#168dff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#050405;color:#fff;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}
body{min-height:100svh;overflow-x:hidden}
.page{
 min-height:100svh;width:100%;display:flex;align-items:center;justify-content:center;
 padding:24px 18px 60px;position:relative;isolation:isolate;
 background:
 radial-gradient(ellipse at 50% 45%,rgba(145,0,35,.34) 0%,rgba(73,0,19,.22) 28%,transparent 63%),
 radial-gradient(ellipse at 50% 0%,rgba(255,25,75,.08),transparent 42%),
 linear-gradient(180deg,#18080d 0%,#0d0709 42%,#050405 82%,#030303 100%);
}
.page:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.018) 4px 5px);z-index:-1}
.card{
 position:relative;width:min(100%,440px);min-height:365px;padding:25px 22px 22px;
 display:flex;flex-direction:column;align-items:center;
 border-radius:18px;background:linear-gradient(145deg,rgba(8,6,9,.97),rgba(18,5,11,.97));
 border:1px solid rgba(255,49,94,.26);
 box-shadow:0 0 24px rgba(255,24,75,.15),0 18px 55px rgba(0,0,0,.55),inset 0 0 24px rgba(255,27,75,.035);
}
.card:before{content:"";position:absolute;inset:-1px;border-radius:19px;padding:1px;background:linear-gradient(135deg,rgba(255,48,91,.9),rgba(255,48,91,.04) 28%,transparent 52%,rgba(255,48,91,.18) 78%,rgba(255,48,91,.72));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.neon-line{position:absolute;top:-2px;left:10%;width:80%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,#ff2457,#ffd0da,#ff2457,transparent);filter:drop-shadow(0 0 5px #ff2457) drop-shadow(0 0 12px #ff2457);animation:scan 2.5s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateX(-5%);opacity:.6}50%{transform:translateX(5%);opacity:1}}
.logo{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;position:relative;margin:0 auto 15px;background:radial-gradient(circle at 35% 30%,#18395c,#07101e 58%,#020307 100%);border:2px solid #2789f5;box-shadow:0 0 0 3px rgba(255,40,88,.9),0 0 18px rgba(255,28,76,.8),0 0 27px rgba(23,119,255,.48)}
.logo:before{content:"";position:absolute;inset:5px;border:1px solid rgba(92,177,255,.8);border-radius:50%}
.logo:after{content:"";position:absolute;inset:12px;border:1px dashed rgba(114,179,255,.65);border-radius:50%}
.logo-art{font-size:43px;line-height:1;filter:drop-shadow(0 0 7px #168dff);z-index:1}
.logo-caption{position:absolute;bottom:17px;font-size:7px;font-weight:900;letter-spacing:1.6px;color:#dbeaff;z-index:2;text-shadow:0 0 5px #168dff}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:clamp(23px,6.2vw,30px);letter-spacing:.8px;text-align:center;margin:2px 0 24px;text-shadow:0 0 12px rgba(255,255,255,.2)}
.verified{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#ff315f;color:#fff;font-size:12px;box-shadow:0 0 12px rgba(255,49,95,.9);flex:none}
.telegram{
 position:relative;isolation:isolate;overflow:visible;
 min-height:62px;width:min(100%,350px);padding:0 20px;
 display:flex;align-items:center;justify-content:center;gap:12px;border-radius:14px;
 text-decoration:none;color:#fff;font-size:15px;font-weight:800;letter-spacing:.2px;text-transform:uppercase;
 background:linear-gradient(180deg,#ff7894 0%,#ff315f 38%,#f20c49 72%,#c90038 100%);
 border:1px solid rgba(255,215,225,.95);
 box-shadow:0 0 0 2px rgba(255,36,87,.28),0 0 12px 4px rgba(255,36,87,.72),0 0 28px 9px rgba(255,20,73,.45),0 0 52px 12px rgba(255,20,73,.18),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -4px 10px rgba(95,0,24,.28);
 animation:buttonGlow 1.8s ease-in-out infinite;
 transition:transform .18s ease,filter .18s ease;
}
.telegram:before{content:"";position:absolute;z-index:-1;inset:-8px;border-radius:20px;background:rgba(255,28,77,.25);filter:blur(13px);opacity:.8;animation:halo 1.8s ease-in-out infinite}
.telegram:after{content:"";position:absolute;inset:3px;border-radius:10px;border-top:1px solid rgba(255,255,255,.38);pointer-events:none}
@keyframes buttonGlow{0%,100%{box-shadow:0 0 0 2px rgba(255,36,87,.24),0 0 10px 3px rgba(255,36,87,.58),0 0 24px 7px rgba(255,20,73,.36),0 0 44px 10px rgba(255,20,73,.14),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -4px 10px rgba(95,0,24,.28)}50%{box-shadow:0 0 0 3px rgba(255,36,87,.38),0 0 18px 7px rgba(255,36,87,.92),0 0 38px 13px rgba(255,20,73,.58),0 0 64px 17px rgba(255,20,73,.25),inset 0 2px 0 rgba(255,255,255,.72),inset 0 -4px 10px rgba(95,0,24,.2)}}
@keyframes halo{0%,100%{opacity:.45;transform:scale(.98)}50%{opacity:1;transform:scale(1.04)}}
.telegram:active{transform:scale(.98);filter:brightness(1.13)}
.tg-icon{width:23px;height:23px;display:inline-grid;place-items:center;flex:none}
.arrow{font-size:27px;font-weight:400;line-height:1;margin-left:3px}
.footer{margin-top:25px;width:100%;text-align:center;color:#e4d6db;font-size:9px;letter-spacing:1.35px}
.footer b{color:#fff;font-weight:900}
.handle{margin-top:9px;color:#ff6688;font-size:10px;letter-spacing:.3px;text-shadow:0 0 8px rgba(255,49,95,.55)}
.bottom-note{position:absolute;bottom:19px;left:0;width:100%;text-align:center;color:rgba(255,255,255,.28);font-size:9px;letter-spacing:1.2px}
@media(max-width:380px){.card{padding:22px 16px 19px;min-height:350px}.telegram{min-height:60px;font-size:13px;width:100%}.brand{margin-bottom:21px}.logo{width:92px;height:92px}}
@media(prefers-reduced-motion:reduce){.neon-line,.telegram,.telegram:before{animation:none}}
/* Prevent double-tap zoom on touch devices while preserving normal scrolling. */
body{touch-action:pan-y}
a,button{touch-action:manipulation}

/* FINAL MOBILE ZOOM LOCK + RESPONSIVE OVERFLOW FIX */
html { width:100%; max-width:100%; overflow-x:hidden; -webkit-text-size-adjust:100%; }
body { width:100%; max-width:100%; overflow-x:hidden; touch-action:pan-y; }
.page { width:100%; max-width:100vw; overflow-x:hidden; }
.card { width:min(100%, 440px); max-width:100%; }
.brand { max-width:100%; font-size:clamp(17px, 5vw, 30px); overflow-wrap:anywhere; }
.telegram { width:100%; max-width:350px; min-width:0; }
.telegram span { min-width:0; }
.footer { max-width:100%; overflow-wrap:anywhere; letter-spacing:clamp(.5px, .25vw, 1.35px); }
.handle { overflow-wrap:anywhere; }

</style>

<body>
<main class="page">
 <section class="card" aria-label="Navi Team Community landing page">
  <div class="neon-line"></div>
  <div class="logo" aria-label="Logo placeholder">
   <span class="logo-art">🐉</span>
   <span class="logo-caption">NAVI TEAM</span>
  </div>
  <div class="brand">NAVI TEAM COMMUNITY</div>
  <a class="telegram" href="https://telegram.dog/+Rar4yYEAs51hNjdl" target="_blank" rel="noopener noreferrer" aria-label="Open Navi Team Community on Telegram">

<script>
/* Reduce double-tap zoom on mobile browsers; normal vertical scrolling remains enabled. */
let lastTouchEnd = 0;
document.addEventListener('touchend', function (event) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) event.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
</script>
</body>
